server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Anything nginx can't find renders the app's own 404 page instead of the
    # default nginx error page (status stays 404).
    error_page 404 /index.html;

    # Long-lived cache for hashed build assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown route serves index.html and React Router
    # decides what to render (unknown routes -> NotFoundPage). No "$uri/" here:
    # it would make directories like /assets answer with nginx's 403 page.
    location / {
        try_files $uri /index.html;
    }
}
